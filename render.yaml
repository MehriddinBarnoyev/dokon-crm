# =============================================================================
#  RENDER.COM BLUEPRINT
#  Render'da: New → Blueprint → shu repozitoriyni tanlang. Bu fayl asosida
#  baza va server avtomatik yaratiladi.
#
#  Faqat BITTA narsani qo'lda kiritasiz: GROQ_API_KEY (pastga qarang).
# =============================================================================

databases:
  - name: dokon-db
    databaseName: dokon
    user: dokon
    plan: free
    postgresMajorVersion: "16"
    # DIQQAT: Render'ning bepul bazasi 30 kundan keyin O'CHIRILADI.
    # Doimiy ishlatish uchun pullik planga o'ting yoki muntazam
    # `pg_dump` bilan zaxira oling.

services:
  - type: web
    name: dokon-api
    runtime: node
    plan: free
    region: frankfurt          # O'zbekistonga eng yaqin Render mintaqasi
    rootDir: server            # repozitoriy ildizi emas, server/ papkasi
    buildCommand: npm ci && npm run build

    # Migratsiya har deploy'da ishlaydi. SQL idempotent (CREATE ... IF NOT
    # EXISTS / OR REPLACE), shuning uchun mavjud ma'lumot yo'qolmaydi.
    startCommand: npm run db:migrate && npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Yuqoridagi baza bilan avtomatik bog'lanadi — qo'lda yozish shart emas
      - key: DATABASE_URL
        fromDatabase:
          name: dokon-db
          property: connectionString

      # Render o'zi tasodifiy maxfiy kalit yaratadi
      - key: JWT_SECRET
        generateValue: true

      # ⚠️ SHUNI QO'LDA KIRITASIZ: Render panelida dokon-api → Environment.
      # console.groq.com/keys dan oling. Bir nechtasini vergul bilan yozish
      # mumkin — biri limitga urilsa tizim keyingisiga o'tadi.
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b

      # TLS_KEY / TLS_CERT ataylab qo'yilmadi: HTTPS ni Render o'zi
      # ta'minlaydi, server esa oddiy HTTP da eshitib turadi.

    # ⚠️ RASMLAR HAQIDA: bepul planda disk YO'Q — `uploads/` papkasi har
    # deploy'da va server uyqudan uyg'onganda tozalanadi, ya'ni mahsulot
    # rasmlari yo'qoladi. Doimiy saqlash uchun pullik planga o'tib quyidagini
    # yoqing (yoki S3/Cloudflare R2 kabi tashqi saqlashga o'ting):
    #
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/server/uploads
    #   sizeGB: 1
